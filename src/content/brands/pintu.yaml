name: Pintu
category: investasi
code: '@notiska'
reward: Cashback dari setiap transaksi
checkedAt: '2026-10-31'
summary: Pintu adalah aplikasi investasi kripto asal Indonesia. Kode referral Pintu memakai username pengundang, sehingga teman yang memakainya mendapat cashback dari volume transaksi dan pengundang mendapat komisi berjenjang.
steps:
  - Unduh aplikasi Pintu versi 3.72 atau lebih baru dari App Store atau Google Play.
  - Daftar akun baru, verifikasi email, lalu selesaikan verifikasi identitas agar bisa bertransaksi.
  - Isi username @notiska pada kolom kode referral saat diminta, lalu mulai transaksi jual beli di Pintu.
  - Cek menu referral untuk melihat status komisi atau cashback yang masuk.
terms:
  - Hanya untuk pengguna terverifikasi dengan aplikasi Pintu versi 3.72 ke atas.
  - Satu orang dengan ID yang sama dihitung sebagai satu akun pengguna.
  - Komisi dihitung dari transaksi di Pintu, Pintu Pro Spot, dan Futures; tidak termasuk CFX dan pajak.
  - Pintu dapat mengubah nilai komisi atau menghentikan program lewat kanal resminya.
faqs:
  - q: Apakah kode referral Pintu berupa deretan angka?
    a: Tidak. Halaman resmi Pintu menjelaskan bahwa kode referral menggunakan username pengundang. Untuk entri ini kodenya adalah @notiska, jadi tulis username lengkapnya saat diminta.
  - q: Berapa cashback yang didapat teman yang diundang?
    a: Pengguna yang diundang mendapat cashback 0,005% dari volume transaksi di Pintu, serta 5% dari biaya transaksi di Pintu Pro Spot dan Futures, sesuai ketentuan yang berlaku.
officialUrl: https://pintu.co.id/
