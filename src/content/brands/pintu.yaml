verificationNote: Blog resmi Pintu yang diperbarui 16 Mei 2025 dibuka pada 31 Oktober 2026 untuk mencatat skema komisi, syarat versi aplikasi, dan batasan transaksi. Pendaftaran uji tidak dilakukan dan kode dari pemilik situs belum dicoba langsung.
