summary: Pintu adalah platform aplikasi investasi dan perdagangan aset kripto resmi di Indonesia. Program referral Pintu menggunakan username pengundang sebagai kode referral unik. Gunakan kode referral @notiska saat mendaftar akun baru untuk mendapatkan cashback transaksi di Pintu biasa dan Pintu Pro Spot & Futures, serta komisi berjenjang hingga 3 level bagi pengundang.
