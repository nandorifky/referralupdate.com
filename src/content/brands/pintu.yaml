  - q: Berapa cashback yang didapat teman yang diundang?
    a: Pendaftar mendapat cashback 0,005% dari volume transaksi di Pintu, ditambah 5% dari biaya transaksi di Pintu Pro Spot dan Futures, sesuai ketentuan yang berlaku.
    intent: bonus
  - q: Kapan cashback dan komisi Pintu bisa dicairkan?
    a: Halaman resmi Pintu tidak menyebut tanggal pencairan tetap. Cashback dan komisi dihitung dari transaksi yang tercatat, lalu bisa dipantau di menu referral aplikasi. Cek ketentuan terbaru di aplikasi sebelum mengharapkan nominal tertentu.
    intent: pencairan
  - q: Siapa yang memenuhi syarat kode referral Pintu?
    a: Kode berlaku untuk akun baru dengan aplikasi Pintu versi 3.72 ke atas dan pengguna yang sudah menyelesaikan verifikasi identitas. Transaksi yang dihitung berasal dari Pintu, Pintu Pro Spot, dan Futures; CFX dan pajak tidak termasuk.
