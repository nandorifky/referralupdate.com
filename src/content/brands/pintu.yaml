steps:
  - Unduh dan pasang aplikasi Pintu (versi 3.72 atau lebih baru) melalui Google Play Store atau Apple App Store.
  - Lakukan pendaftaran akun baru, selesaikan verifikasi email, lalu lanjutkan proses verifikasi identitas (KYC) hingga akun aktif.
  - Masukkan username @notiska pada kolom kode referral saat pendaftaran, atau buka menu Account/Profil > Banner "Ajak Teman, Untung Bersama!" > "Pakai Kode Teman" (maksimal 7 hari setelah verifikasi email).
  - Mulai transaksi jual beli crypto di Pintu atau trading di Pintu Pro Spot & Futures untuk langsung mengaktifkan perhitungan cashback transaksi.
  - Pantau dan klaim akumulasi bonus secara berkala melalui menu Referral di aplikasi Pintu.
terms:
  - Berlaku khusus bagi pengguna terverifikasi (KYC) dengan aplikasi Pintu versi minimal 3.72.
  - Ketentuan satu akun pengguna dihitung berdasarkan satu identitas resmi (KTP/ID) dan device.
  - Input kode referral hanya dapat dilakukan saat registrasi atau maksimal 7 hari kalender sejak verifikasi email diselesaikan.
  - Perhitungan komisi dan cashback berlaku pada transaksi di Pintu, Pintu Pro Spot, dan Futures (tidak mencakup CFX dan biaya pajak).
  - Pintu berhak memperbarui struktur komisi, syarat, maupun ketentuan program referral sewaktu-waktu melalui media komunikasi resmi mereka.
faqs:
  - q: Apa itu kode referral Pintu dan bagaimana bentuk kodenya?
    a: Kode referral Pintu adalah ID rujukan unik berupa username milik pengundang di aplikasi Pintu. Kode ini bukan deretan angka acak, jadi Anda tinggal memasukkan username resmi kami yaitu @notiska pada kolom yang tersedia saat pendaftaran atau di menu Pakai Kode Teman.
    intent: cara-pakai
  - q: Berapa besar cashback dan bonus yang didapat oleh pengguna baru?
    a: Sebagai pendaftar baru yang menggunakan kode rujukan, Anda akan menerima cashback sebesar 0,005% dari total volume transaksi untuk perdagangan di Pintu reguler, plus cashback 5% dari total biaya (fee) trading untuk transaksi di Pintu Pro Spot dan Futures.
    intent: bonus
  - q: Bagaimana syarat agar bisa menggunakan kode referral Pintu?
    a: Syarat utamanya adalah pendaftar merupakan pengguna baru yang mengunduh aplikasi Pintu versi 3.72 ke atas, menyelesaikan verifikasi identitas (KYC), dan memasukkan kode referral @notiska saat registrasi atau paling lambat 7 hari kalender setelah verifikasi email.
    intent: syarat
  - q: Kapan dan bagaimana cara mencairkan komisi serta cashback Pintu?
    a: Cashback dan komisi terakumulasi secara otomatis setelah transaksi tercatat. Untuk mencairkannya, buka menu Referral di aplikasi Pintu, pilih tab Komisi, lalu klik Klaim untuk memindahkan saldo ke dompet IDRT. Setelah itu, tukarkan IDRT ke saldo Rupiah (IDR) di menu Wallet dan lakukan penarikan (Tarik) langsung ke rekening bank pribadi Anda.
    intent: pencairan
  - q: Berapa lama masa berlaku kode referral Pintu setelah dihubungkan?
    a: Selama kode referral berhasil dimasukkan dalam tenggat waktu 7 hari setelah verifikasi email, keterikatan akun Anda dengan kode rujukan tersebut berlaku selamanya tanpa batas waktu (lifetime), sehingga cashback transaksi akan terus berjalan sesuai ketentuan aktif dari Pintu.
    intent: masa-berlaku
  - q: Apakah aman menggunakan kode referral @notiska di aplikasi Pintu?
    a: Sangat aman. Pintu adalah platform investasi aset kripto yang resmi terdaftar dan diawasi oleh otoritas berwenang di Indonesia. Memasukkan kode referral resmi @notiska tidak akan mengubah keamanan akun maupun data pribadi Anda, melainkan murni memberikan hak reward cashback transaksi resmi dari sistem Pintu.
    intent: keamanan
