      ketentuan akun dan KYC jika diminta saat mengklaim hadiah.
    intent: syarat

  - q: 'Kapan bonus referral Bybit masuk dan bagaimana cara mencairkannya?'
    a: >-
      Bybit menerapkan pemeriksaan risiko selama 3 hari sebelum hadiah
      dikreditkan. Setelah hadiah didistribusikan, pengguna memiliki waktu
      10 hari untuk mengklaimnya. Bonus dapat digunakan untuk aktivitas
