terms:
  - Bonus referral ini mengikuti skema untuk pengguna yang mendaftar pada atau setelah 10 Oktober 2026 pukul 12.00 UTC.
  - Pengguna baru wajib menggunakan kode atau tautan referral ketika mendaftar. Kode tidak dapat ditambahkan setelah akun dibuat.
  - First Trade minimal 50 USD harus dilakukan dalam 14 hari sejak pendaftaran agar pengguna baru dan pemberi referral masing-masing memperoleh bonus 50 USDT.
  - Volume trading kumulatif minimal 500 USD dalam 30 hari setelah First Time Trade memberikan bonus 100 USDT kepada masing-masing pihak.
  - Volume trading kumulatif minimal 10.000 USD dalam periode yang sama memberikan bonus tambahan 100 USDT kepada masing-masing pihak.
  - Total maksimal bonus referral adalah 250 USDT untuk pengguna baru dan 250 USDT untuk pemberi referral, atau 500 USDT secara gabungan.
  - First Time Trade dan perhitungan volume trading mengikuti jenis produk yang diakui dalam program. Pasangan trading tanpa biaya pada Spot, Derivatif, dan Options tidak dihitung dalam volume yang memenuhi syarat.
  - KYC diperlukan untuk mengklaim hadiah sesuai ketentuan Rewards Hub.
  - Bonus tidak dapat ditarik sebagai uang tunai, tetapi dapat digunakan untuk aktivitas trading yang didukung sesuai jenis bonus. Keuntungan dari perdagangan menggunakan bonus mengikuti ketentuan penarikan yang berlaku.
  - Setiap bonus dapat memiliki batas waktu klaim dan tanggal kedaluwarsa tersendiri.
  - Komisi referral berlaku selama 365 hari sejak pengguna yang diundang mendaftar dan dihitung berdasarkan biaya trading bersih.
  - Komisi awal sebesar 20% dapat meningkat menjadi 25% setelah mengundang 5 referee yang memenuhi syarat dalam satu kuartal.
  - Komisi dapat meningkat menjadi 30% setelah mengundang 100 referee yang memenuhi syarat atau mencapai volume trading Derivatif sebesar 15 juta USD melalui referral dalam satu kuartal.
  - Komisi referral dibatasi maksimal 5.000 USD per pemberi referral setiap kuartal. Batas tersebut dapat dihapus untuk kuartal berikutnya jika pemberi referral mengundang minimal 15 pengguna baru dalam satu kuartal yang masing-masing melakukan deposit minimal 100 USD dan menyelesaikan First Time Trade.
  - Hubungan referral dapat dihentikan jika pengguna yang diundang tidak melakukan trading selama 180 hari berturut-turut.
  - Bonus dan komisi tetap mengikuti pemeriksaan kelayakan, batas reward, dan ketentuan program Bybit yang berlaku.

