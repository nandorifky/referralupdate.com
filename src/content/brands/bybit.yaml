      Keuntungan dari trading menggunakan bonus dapat ditarik sesuai
      ketentuan produk. Komisi referral dibagikan setiap hari pada pukul
      04.00 UTC.
    intent: pencairan

  - q: 'Bagaimana cara menggunakan kode referral Bybit RX452A2?'
    a: >-
      Buka tautan undangan Bybit atau halaman pendaftaran resmi. Jika
      menggunakan tautan undangan, pastikan kode RX452A2 sudah terpasang.
      Jika mendaftar langsung, masukkan kode tersebut pada kolom Referral
