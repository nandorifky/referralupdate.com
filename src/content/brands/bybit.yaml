    intent: cara-pakai

  - q: 'Berapa lama masa berlaku bonus referral Bybit?'
    a: >-
      Hadiah harus diklaim maksimal 10 hari setelah didistribusikan.
      Setelah diklaim, bonus dapat memiliki tanggal kedaluwarsa tersendiri.
      Periksa informasi pada Rewards Hub atau halaman detail hadiah di akun
      Bybit untuk mengetahui batas waktu penggunaan setiap bonus.
    intent: masa-berlaku

  - q: 'Apakah bonus referral Bybit bisa ditarik ke rekening atau dompet?'
    a: >-
      Tidak. Bonus Bybit tidak dapat ditarik sebagai uang tunai atau
      dipindahkan ke dompet eksternal. Pengguna dapat memanfaatkannya
      untuk aktivitas trading yang didukung sesuai jenis bonus.
      Keuntungan yang diperoleh dari perdagangan menggunakan bonus dapat
      ditarik mengikuti ketentuan Bybit.
    intent: pencairan

  - q: 'Apakah kode referral Bybit RX452A2 aman digunakan?'
