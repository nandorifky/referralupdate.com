  - q: Bagaimana cara mendapat komisi Affiliate DANA Bisnis?
    a: Peserta membagikan informasi atau referral DANA Bisnis kepada calon pengguna usaha. Komisi diberikan jika mekanisme dan kriteria program terpenuhi sesuai syarat dan ketentuan yang berlaku.
