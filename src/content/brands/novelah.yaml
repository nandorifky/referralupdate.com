steps:
  - Unduh Novelah dari Google Play atau App Store, lalu buat akun baru.
  - Buka halaman undangan atau isi kode 1831553 pada kolom invitation code saat diminta.
  - Baca novel, check-in, dan selesaikan tugas untuk mengumpulkan poin.
  - Tukar poin di menu rewards sesuai hadiah yang tersedia.
terms:
  - Poin dikumpulkan dari membaca harian, check-in, tugas, game, undian, dan undangan teman.
  - Poin dapat ditukar hadiah sesuai ketentuan yang berlaku di aplikasi.
  - Tautan undangan pada entri ini memakai domain run.app di luar novelah.net, jadi unduh aplikasi hanya dari toko resmi.
  - Nominal poin undangan dapat berubah dan tidak dijamin oleh halaman resmi Novelah.
