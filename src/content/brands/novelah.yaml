  - q: Apakah tautan undangan Novelah aman?
    a: Tautan undangan pada entri ini memakai domain run.app, bukan novelah.net, sehingga status resminya tidak bisa kami pastikan. Unduh aplikasi hanya dari Google Play atau App Store, lalu masukkan kode 1831553 secara manual.
