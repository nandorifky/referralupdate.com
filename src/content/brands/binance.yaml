    intent: pencairan
  - q: Di mana kode GGBINANCE dimasukkan?
    a: Isi kode GGBINANCE di kolom Referral ID pada formulir pendaftaran akun baru. Selesaikan verifikasi identitas kalau diminta, lalu penuhi tugas kampanye yang tampil di akun.
