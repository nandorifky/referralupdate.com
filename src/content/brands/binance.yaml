rewardReferee: >-
  Pengguna baru yang mendaftar melalui Referral Lite dapat memperoleh voucher
  rabat biaya trading hingga setara 100 USD setelah pembelian kripto kumulatif
  melebihi 50 USD. Jika kemudian menyelesaikan trading kumulatif lebih dari
  100 USD melalui Spot atau Convert, tersedia voucher tambahan hingga
  setara 1.000 USD. Total maksimum yang disebut Binance adalah hingga
  1.100 USD, bukan nominal yang dijamin untuk setiap akun.

rewardReferrer: >-
  Pada Referral Lite, pemberi referral dapat memperoleh voucher rabat biaya
  trading hingga setara 1.000 USD setelah pengguna yang diundang menyelesaikan
  kedua tugas. Pada Referral Pro, pemberi referral memperoleh komisi dari
  biaya trading pengguna yang diundang. Persentase dan ketentuan komisi
  mengikuti pengaturan akun serta program yang berlaku. Satu pengguna baru
  hanya dapat menggunakan satu mode referral.

rewardReferrerShort: Voucher rabat biaya trading hingga setara 1.000 USD (Referral Lite) atau komisi dari biaya trading (Referral Pro).

payoutNote: >-
  Untuk Referral Lite, voucher didistribusikan dalam waktu hingga 48 jam
  setelah tugas terkait selesai. Voucher harus diklaim melalui Rewards Hub
  dalam 7 hari setelah didistribusikan dan berlaku selama 14 hari setelah
  diaktifkan. Voucher referral digunakan untuk rabat biaya trading Spot,
  bukan untuk mengurangi seluruh jenis biaya transaksi. Untuk Referral Pro,
  komisi mengikuti ketentuan program dan tercatat pada akun pemberi referral.
  Periksa Rewards Hub atau halaman Referral untuk status dan detail hadiah.

eligibility:
  - Pengguna harus memenuhi ketentuan pengguna baru Binance dan belum menggunakan mode referral lain.
  - Pendaftaran harus menggunakan undangan atau kode dari mode referral yang sesuai.
  - Untuk tugas Referral Lite, pembelian kripto kumulatif harus melebihi 50 USD dalam 14 hari setelah pendaftaran.
  - Untuk tugas voucher berikutnya, volume trading kumulatif harus melebihi 100 USD melalui Spot atau Convert.
  - Pembelian yang diperhitungkan meliputi setoran tunai, pembelian dengan kartu debit/kredit, dan perdagangan P2P.
  - Setoran kripto, transfer internal dari akun Binance lain, dan metode pembayaran pihak ketiga tidak dihitung sebagai pembelian yang memenuhi tugas.
  - Pengguna harus menyelesaikan verifikasi identitas (KYC) untuk mengklaim voucher.
  - Ketersediaan program tetap mengikuti ketentuan wilayah dan kelayakan akun Binance.

