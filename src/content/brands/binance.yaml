steps:
  - Buka situs resmi binance.com atau unduh aplikasi Binance melalui halaman unduhan resminya.
  - Pilih pendaftaran akun baru dan periksa apakah formulir menyediakan kolom Referral ID atau kode referral.
  - Masukkan kode GGBINANCE sebelum menyelesaikan pendaftaran akun.
  - Pastikan mode referral dan ketentuan hadiah yang tampil sesuai dengan program yang ingin diikuti.
  - Selesaikan verifikasi identitas jika diminta dan periksa tugas yang tersedia di halaman Referral atau Rewards Hub.
  - Untuk Referral Lite, selesaikan pembelian kripto dan volume trading sesuai batas serta tenggat yang ditampilkan.
  - Periksa Rewards Hub untuk mengetahui status voucher, batas waktu klaim, dan masa berlaku.

terms:
  - Program referral hanya berlaku bagi pengguna yang memenuhi persyaratan Binance.
  - Pengguna baru hanya dapat mengikuti satu mode referral, yaitu Referral Lite atau Referral Pro.
  - Referral Lite memberikan voucher satu kali berdasarkan penyelesaian tugas, bukan komisi trading berkelanjutan.
  - Pembelian kripto lebih dari 50 USD dan trading lebih dari 100 USD merupakan ambang tugas, bukan nominal bonus.
  - Tugas Referral Lite harus diselesaikan dalam 14 hari setelah pendaftaran.
  - Pembelian yang diperhitungkan meliputi setoran tunai, kartu debit/kredit, dan P2P.
  - Volume trading yang diperhitungkan untuk tugas ini berasal dari Spot atau Convert. Trading API dan bot tidak berlaku.
  - Voucher harus diklaim dalam 7 hari setelah distribusi dan berlaku 14 hari setelah aktivasi.
  - Voucher rabat biaya trading dari program ini hanya berlaku untuk biaya trading Spot.
  - Nominal reward dapat berbeda sesuai kampanye, kelayakan akun, dan ketentuan Binance.
  - Binance dapat mengubah mekanisme, persyaratan, dan ketersediaan program.

faqs:
  - q: 'Berapa bonus dari kode referral Binance GGBINANCE?'
    a: >-
      Kode GGBINANCE digunakan untuk pendaftaran akun baru. Pada Referral Lite,
      pengguna baru berpotensi memperoleh voucher rabat biaya trading hingga
      setara 100 USD setelah pembelian kripto melebihi 50 USD dan hingga
      tambahan 1.000 USD setelah volume trading melebihi 100 USD melalui
      Spot atau Convert. Totalnya dapat mencapai 1.100 USD, tetapi bukan
      bonus tetap atau jaminan untuk setiap akun.
    intent: bonus

  - q: 'Apa syarat mendapatkan bonus referral Binance?'
    a: >-
      Pengguna harus memenuhi ketentuan akun baru dan menyelesaikan tugas
      Referral Lite dalam 14 hari setelah pendaftaran. Tugasnya meliputi
      pembelian kripto kumulatif lebih dari 50 USD melalui saluran yang
      memenuhi syarat serta trading kumulatif lebih dari 100 USD melalui
      Spot atau Convert. Verifikasi identitas diperlukan untuk mengklaim
      voucher. Ketentuan akhir mengikuti kampanye yang tampil di akun.
    intent: syarat

  - q: 'Kapan bonus referral Binance masuk?'
    a: >-
      Menurut ketentuan Referral Lite, voucher didistribusikan dalam waktu
      hingga 48 jam setelah tugas terkait selesai. Pengguna perlu membuka
      Rewards Hub untuk mengklaimnya. Untuk Referral Pro, komisi mengikuti
      mekanisme distribusi dan pencatatan pada akun pemberi referral.
    intent: pencairan

  - q: 'Berapa lama masa berlaku voucher referral Binance?'
    a: >-
      Voucher Referral Lite harus diklaim dalam 7 hari setelah didistribusikan.
      Setelah diaktifkan, voucher berlaku selama 14 hari. Periksa tanggal
      kedaluwarsa yang tercantum di Rewards Hub karena voucher yang melewati
      masa klaim atau masa berlaku tidak dapat digunakan.
    intent: masa-berlaku

  - q: 'Bagaimana cara memasukkan kode referral Binance GGBINANCE?'
    a: >-
      Buka situs atau aplikasi resmi Binance, pilih pendaftaran akun baru,
      lalu masukkan GGBINANCE pada kolom Referral ID jika tersedia.
      Masukkan kode sebelum menyelesaikan pendaftaran. Setelah akun dibuat,
      selesaikan verifikasi identitas dan tugas kampanye yang memenuhi syarat.
    intent: cara-pakai

  - q: 'Apakah aman menggunakan kode referral Binance?'
    a: >-
      Kode referral hanya berfungsi sebagai identitas undangan dan tidak
      menggantikan proses keamanan akun. Masukkan kode melalui situs atau
      aplikasi resmi Binance. Jangan pernah memberikan kata sandi, kode OTP,
      kunci keamanan, atau seed phrase kepada pihak yang mengaku membantu
      proses referral. Periksa alamat situs sebelum masuk atau melakukan
      transaksi.
    intent: keamanan

  - q: 'Apa perbedaan Referral Lite dan Referral Pro Binance?'
    a: >-
      Referral Lite memberikan reward satu kali berupa voucher rabat biaya
      trading setelah tugas kampanye selesai. Referral Pro memberikan
      komisi berdasarkan biaya trading pengguna yang diundang. Pengguna
      baru hanya dapat memilih salah satu mode dan tidak dapat memperoleh
      kedua jenis reward dari pendaftaran yang sama.
    intent: bonus

  - q: 'Apakah kode GGBINANCE menjamin bonus 1.100 USD?'
    a: >-
      Tidak. Angka hingga 1.100 USD merupakan batas maksimum voucher yang
      dapat diperoleh pengguna baru melalui penyelesaian dua tugas Referral
      Lite. Besaran aktual mengikuti perhitungan reward, kampanye, dan
      kelayakan akun yang ditetapkan Binance. Penggunaan kode saja tidak
      otomatis menghasilkan bonus.
    intent: syarat

