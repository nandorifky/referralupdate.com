steps:
  - Buka aplikasi GoPay, masuk ke halaman GoPay Pinjam, lalu pilih menu Undang Teman.
  - Masukkan kode undangan QJHP4P pada kolom kode referral saat aktivasi, lalu klik Lanjut.
  - Lengkapi data diri, ajukan aktivasi GoPay Pinjam, dan tunggu persetujuan limit.
  - Setelah disetujui, ajukan pencairan pinjaman pertama sesuai kebutuhan dan kemampuan bayar.
  - Cek saldo GoPay paling lambat 24 jam setelah pencairan pertama untuk memastikan bonus masuk.

terms:
  - Program berlaku untuk pengguna baru GoPay Pinjam yang belum pernah aktivasi dan belum punya limit.
  - Bonus pendaftar Rp50.000 diberikan setelah pengajuan disetujui dan pencairan pinjaman pertama berhasil.
  - Bonus pengundang Rp50.000 diberikan untuk setiap teman yang memenuhi syarat, maksimal 20 kali.
  - Hadiah saldo GoPay dikirim paling lambat 24 jam setelah pencairan pertama.
  - GoPay Pinjam berhak membatalkan promo jika ada indikasi penyalahgunaan atau kecurangan.
  - Syarat dan ketentuan dapat berubah atau dihentikan tanpa pemberitahuan sebelumnya.
  - Pinjaman memiliki bunga, biaya, dan risiko gagal bayar; bonus tidak menghapus kewajiban tersebut.

faqs:
  - q: Berapa bonus dari kode undangan GoPay Pinjam QJHP4P?
    a: >-
      Pendaftar yang menggunakan kode QJHP4P, disetujui, dan mencairkan
      pinjaman pertama berhak atas saldo GoPay Rp50.000. Pengundang juga
      mendapat Rp50.000 untuk setiap teman yang memenuhi syarat, dengan
      batas maksimal 20 hadiah. Bonus dikirim paling lambat 24 jam setelah
      pencairan pertama.
    intent: bonus
  - q: Apa syarat agar kode undangan GoPay Pinjam di-ACC?
    a: >-
      Kamu harus merupakan pengguna baru yang belum pernah mengaktifkan
      GoPay Pinjam, memasukkan kode QJHP4P saat aktivasi, dan menyelesaikan
      proses pengajuan hingga disetujui. Kode undangan tidak menjamin
      persetujuan; keputusan tetap mengikuti penilaian GoPay Pinjam
      terhadap data dan kemampuan bayar kamu.
    intent: syarat
  - q: Kapan bonus saldo GoPay Pinjam masuk?
    a: >-
      Bonus dikirim paling lambat 24 jam setelah pencairan pinjaman pertama
      berhasil. Cek saldo GoPay secara berkala. Kalau bonus belum masuk
      setelah batas waktu tersebut, hubungi layanan resmi GoPay melalui
      aplikasi atau situs gopay.co.id, bukan pihak yang mengirim kode.
    intent: pencairan
  - q: Sampai kapan program undang teman GoPay Pinjam berlaku?
    a: >-
      Halaman resmi GoPay tidak mencantumkan tanggal berakhir program.
      Informasi di halaman ini diperiksa pada 3 November 2026. GoPay Pinjam
      dapat mengubah syarat atau menghentikan promosi sewaktu-waktu, jadi
      cek kembali halaman resmi sebelum mengajukan pinjaman.
    intent: masa-berlaku
  - q: Bagaimana cara memakai kode undangan QJHP4P?
    a: >-
      Buka aplikasi GoPay, masuk ke GoPay Pinjam, lalu pilih menu Undang
      Teman atau Aktivasi. Masukkan QJHP4P pada kolom kode referral,
      lengkapi data diri, dan kirim pengajuan. Setelah disetujui, lakukan
      pencairan pinjaman pertama untuk memenuhi syarat bonus.
    intent: cara-pakai
  - q: Apakah aman memakai kode undangan GoPay Pinjam?
    a: >-
      Gunakan kode hanya melalui aplikasi resmi GoPay. Kode undangan bukan
      PIN, kata sandi, atau OTP, jadi jangan pernah membagikan kode
      verifikasi kepada siapa pun. Ingat juga bahwa pinjaman menimbulkan
      kewajiban bayar beserta bunga dan biaya; jangan meminjam hanya untuk
      mengejar bonus saldo.
    intent: keamanan

