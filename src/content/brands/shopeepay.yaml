  - q: Di mana kode referral ShopeePay dimasukkan?
    a: Kode dimasukkan saat teman mendaftar akun ShopeePay baru, sebelum akun diaktifkan. Kode yang sama juga bisa dibagikan lewat tautan undangan dari menu Undang Teman.
