steps:
  - Unduh aplikasi Nanovest dari Google Play Store atau App Store melalui tautan resmi di nanovest.io.
  - Buka aplikasi, daftar dengan nomor ponsel, lalu masukkan kode OTP yang dikirim.
  - Isi kode referral nandorifk356 pada kolom yang tersedia saat membuat akun, sebelum pendaftaran selesai.
  - Buat Nanotag, lalu selesaikan verifikasi identitas atau KYC dengan KTP dan liveness check.
  - Lakukan top-up minimal Rp20.000 dari rekening bank atau kanal resmi; transfer P2P tidak dihitung.
  - Lakukan pembelian pertama, lalu tingkatkan volume transaksi kripto atau saham AS hingga minimal Rp10.000.000.
  - Pantau misi dan hadiah di halaman Referral, lalu klaim NBT yang sudah tersedia.
  - Setelah masa kunci 30 hari berakhir, jual NBT sesuai ketentuan aplikasi apabila ingin memindahkan nilainya.

terms:
  - Kode referral adalah Nanotag pengundang; perubahan Nanotag otomatis mengubah kode referral.
  - Kode dimasukkan saat pembuatan akun. Panduan resmi tidak menjelaskan penambahan kode setelah akun selesai dibuat.
  - Empat misi harus diselesaikan secara berurutan; misi yang tidak berurutan dapat menggagalkan hadiah.
  - Top-up minimal Rp20.000 tidak berlaku untuk transfer P2P.
  - Misi volume minimal Rp10.000.000 hanya menghitung transaksi kripto dan saham AS.
  - Hadiah dibatasi untuk 200.000 referral pertama dan nominalnya dapat berubah setelah kuota habis.
  - NBT dikunci 30 hari kalender sejak klaim; nilai tukar NBT tidak dijamin.
  - Pengali hadiah 1,5x tersedia bagi pengguna yang melakukan staking minimal 100.000 NBT sesuai ketentuan kampanye.
  - Komisi 0,03% memerlukan volume referral minimal Rp1.000.000 dan dikirim sebagai scratch card.
  - Scratch card komisi harus diklaim maksimal 30 hari kalender setelah terkirim.
  - Satu perangkat hanya untuk satu akun; perangkat yang sama tidak boleh dipakai untuk misi referral berbeda.
  - Nanovest dapat mengubah, memperpanjang, atau menghentikan program sesuai ketentuan yang berlaku.
  - Hadiah dipotong pajak sesuai peraturan; reward referral bukan jaminan keuntungan investasi.

