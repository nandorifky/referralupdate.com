  Rp30.000 setelah volume transaksi mencapai minimal Rp10.000.000.
  Totalnya hingga Rp40.000 per pihak jika keempat misi diselesaikan
  secara berurutan dalam periode kampanye. Misi volume terakhir hanya
  menghitung transaksi kripto dan saham AS. NBT yang diklaim terkunci
  selama 30 hari kalender sebelum dapat dijual, dan nilainya mengikuti
  harga pasar.

rewardReferrer: >-
  Pengundang memperoleh NBT dari setiap misi yang diselesaikan referral,
  sama seperti pendaftar, hingga Rp40.000 per referral yang menuntaskan
  keempat misi. Selain itu tersedia Komisi Referral sebesar 0,03% dari
  total volume transaksi referral yang memenuhi syarat, dengan volume
  minimal Rp1.000.000. Perhitungan komisi mencakup transaksi kripto,
  saham AS, dan emas digital. Komisi dikirim dalam bentuk scratch card
  paling lambat 14 hari kerja setelah periode kampanye berakhir. Periode,
  kuota, dan nominal aktual mengikuti campaign yang tampil di aplikasi.

rewardReferrerShort: NBT hingga Rp40.000 per referral plus komisi 0,03% dari volume transaksi yang memenuhi syarat.

payoutNote: >-
  Hadiah NBT dikirim ke akun setelah misi referral terpenuhi dan diklaim.
  NBT tersebut terkunci selama 30 hari kalender sejak klaim sebelum dapat
  dijual. Komisi 0,03% dikirim sebagai scratch card paling lambat 14 hari
  kerja setelah periode kampanye selesai dan harus diklaim maksimal 30
  hari kalender setelah kartu terkirim. Hadiah dipotong pajak sesuai
  ketentuan yang berlaku, dan nilai NBT dapat berubah mengikuti harga pasar.

eligibility:
  - Pendaftar adalah pengguna baru yang membuat akun Nanovest menggunakan kode nandorifk356.
  - Pengundang harus memiliki akun Nanovest yang aktif dan sudah menyelesaikan KYC.
  - Pendaftar menyelesaikan KYC, top-up minimal Rp20.000, transaksi pembelian pertama, lalu mencapai volume transaksi minimal Rp10.000.000.
  - Keempat misi diselesaikan secara berurutan dalam periode kampanye yang sedang berlangsung di aplikasi.
  - Top-up melalui transfer P2P tidak dihitung sebagai pemenuhan misi top-up.
  - Misi volume Rp10.000.000 hanya berlaku untuk transaksi kripto dan saham AS, bukan emas digital.
  - Kuota hadiah berlaku untuk 200.000 referral pertama; nominal dapat berubah setelah kuota habis.
  - Satu perangkat ponsel hanya untuk satu akun, dan perangkat yang sama tidak boleh dipakai untuk menjalankan misi referral berbeda.
  - Kode referral mengikuti Nanotag pengundang; jika Nanotag diubah, kode lama ikut berubah.

