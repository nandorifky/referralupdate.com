summary: SeaBank adalah bank digital yang terhubung dengan ekosistem Shopee dan SeaMoney. Kampanye undang teman memberi bonus saldo kepada pengundang dan teman baru setelah rekening dibuka dan syarat setoran terpenuhi.
steps:
  - Unduh aplikasi SeaBank, buka rekening baru atas namamu, lalu selesaikan verifikasi KTP dan video.
  - Isi kode referral 43V68B saat pendaftaran atau buka tautan undangan yang kamu terima.
  - Setor minimal Rp50.000 dari sumber selain rekening SeaBank, lalu simpan saldo tersebut selama 3 hari.
  - Klaim bonus di halaman Undang Teman atau Referral setelah teman memenuhi syarat; bonus diproses maksimal 48 jam setelah klaim.
terms:
  - Kampanye yang dirujuk berlaku 1–31 Oktober 2026 untuk nasabah baru; cek halaman promo untuk periode berikutnya.
  - Setoran minimal Rp50.000 berasal dari luar SeaBank dan disimpan 3 hari; transfer sesama rekening SeaBank tidak dihitung.
  - Bonus pengundang Rp25.000 dan bonus teman Rp10.000 mengikuti kriteria kampanye, dengan batas 200 teman atau Rp5.000.000 per bulan.
  - Bonus harus diklaim dan tidak dapat digabung dengan promo buka rekening lain.
faqs:
  - q: Berapa bonus undang teman SeaBank?
    a: Halaman promo SeaBank menyebut bonus Rp25.000 untuk pengundang dan Rp10.000 untuk teman baru setelah setoran minimal Rp50.000 disimpan 3 hari. Nominal dan periode mengikuti kampanye yang berlaku.
  - q: Sampai kapan promo undang teman SeaBank berlangsung?
    a: Pusat bantuan SeaBank menyebut periode 1–31 Oktober 2026. Setelah tanggal itu, cek halaman promo untuk memastikan program diperpanjang atau diganti.
  - q: Apakah transfer dari sesama rekening SeaBank dihitung?
    a: Tidak. Setoran memakai dana dari luar rekening SeaBank, lalu saldo disimpan 3 hari. Batas bonus adalah 200 teman atau Rp5.000.000 per bulan.
